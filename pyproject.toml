[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

######################
#  Project metadata  #
######################
[project]
name            = "citk"
dynamic         = ["version"]
description     = "Causal Inference Toolkit — A Python Native Library for Building Causally Intelligent Systems"
readme          = "README.md"
license         = {text = "MIT"}
authors         = [
  {name = "Ryan Sherby", email = "ryan.sherby@columbia.edu"},
  {name = "Columbia Causal AI Lab"},
]
maintainers     = [
  {name = "Ryan Sherby", email = "ryan.sherby@columbia.edu"},
]
requires-python = ">=3.9"

keywords = [
  "causal-inference",
  "structural-causal-models",
  "do-calculus",
  "counterfactuals",
  "machine-learning",
  "causal-identification",
  "causal-analysis",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "sympy>=1.13",
  "networkx>=3.4.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "graphviz>=0.20.3",
  "ipython>=8.0",
]

##########################
# Optional run-time deps #
##########################
[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "twine>=5.0",
  "hatch>=1.12",
]
docs = []
viz = []
torch = []

[project.scripts]
citk-test = "citk.__tests__.run:main"

#############
# Project URLs
#############
[project.urls]
Homepage      = "https://github.com/CausalAILab/causalai-book/tree/main"
Documentation = "https://github.com/CausalAILab/causalai-book/blob/main/README.md"
Issues        = "https://github.com/CausalAILab/causalai-book/issues"

#######################
# Hatch build settings
#######################
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
include = [
  "/src/citk",
  "/LICENSE",
  "/README.md",
  "/CITATION.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/citk"]

[tool.hatch.envs.default]
features = ["test"]

[tool.hatch.envs.default.scripts]
test = "citk-test {args}"
pytest = "pytest {args:src/citk/__tests__}"

[tool.hatch.envs.test]
features = ["test"]

[tool.hatch.envs.test.scripts]
run = "citk-test {args}"

[tool.pytest.ini_options]
testpaths = ["src/citk/__tests__"]
python_files = ["chapter_*_tests.py", "test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-q"
